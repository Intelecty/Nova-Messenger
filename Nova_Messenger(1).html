  doc:id=>({

   update:async d=>{const o=ndbRead(p);if(!(id in o))throw new Error("not-found");o[id]=Object.assign({},o[id],ndbClone(d||{}));ndbWrite(p,o);ndbNotify(p)},
   delete:async()=>{const o=ndbRead(p);delete o[id];ndbWrite(p,o);ndbNotify(p)},
   onSnapshot:(cb,err)=>ndbSub(p,()=>{const o=ndbRead(p)[id];return {id,exists:o!==undefined,data:()=>o===undefined?undefined:ndbClone(o),docs:o===undefined?[]:[{id,data:()=>ndbClone(o)}]}},cb,err)

function fbWrap(fdb,fs){

  const ref=()=>{const parts=[];if(q.ord)parts.push(fs.orderBy(q.ord[0],q.ord[1]));if(q.lim)parts.push(fs.limit(q.lim));return parts.length?fs.query(fs.collection(fdb,p),...parts):fs.collection(fdb,p)};

/* ---- Вход и защита аккаунта ----
   Свой трастнутый браузер входит без предупреждений. Новое устройство входит по PIN,
   владелец получает предупреждение (users/{id}/alerts). «Нет» выкидывает вошедшего и требует PIN,
   «Да» доверяет устройство.
   ВАЖНО: защита условная. Хеш PIN и предупреждения лежат в общем хранилище: их может прочитать
   и подменить любой участник с правом записи. Выкидывание срабатывает при следующей проверке сеанса

const PIN_RE=/^\d{4,8}$/;const isOwnerPhone=p=>{const d=String(p||"").replace(/\D/g,"");return d.endsWith("777111111")||d.endsWith("7771111111")};

 dropMenu(btn,[["👤","Профиль",()=>openProfile(id)],["📞","Аудиозвонок",()=>startCall(false)],["📹","Видеозвонок",()=>startCall(true)],["☑️","Выбрать сообщения",()=>{SELMODE=true;toast("Выберите сообщения: клик по сообщению")}],["🔍","Поиск по чату",search],["📝","Заметка о контакте",()=>noteEdit(id)],["📤","Экспорт переписки",()=>{const t=[...document.querySelectorAll("#msgs .b[data-id]")].map(b=>{const m=MSG[b.dataset.id]||{};return "["+new Date(m.t).toLocaleString("ru")+"] "+((USERS[m.f]||{}).name||"?")+": "+(m.x||m.n||"["+m.k+"]")}).join("\n");navigator.clipboard.writeText(t).then(()=>toast("Переписка скопирована"),()=>toast("Не удалось скопировать"))}],["🧹","Удалить мои сообщения",async()=>{const ids=[...document.querySelectorAll("#msgs .b.me[data-id]")].map(b=>b.dataset.id);if(!ids.length||!confirm("Удалить моих сообщений: "+ids.length+"?"))return;await Promise.all(ids.map(i=>db.collection("chats/"+PID+"/msgs").doc(i).delete().catch(()=>0)))}],["🚫","Заблокировать / разблокировать",()=>toggleBlock(id)],["🗑","Удалить чат",()=>{if(!confirm("Удалить чат? Он исчезнет из вашего списка."))return;LS.s("clr_"+PID,String(Date.now()));$("msgs").innerHTML="";renderList();toast("Чат удалён из вашего списка")},"red"]])}
function showBlocked(){const sv=()=>db.collection("users").doc(ME.id).update({blk:ME.blk||[],blkr:ME.blkr||{}}),o=ov(`<div class="pd"><div class="row"><b class="g" style="font-size:18px">🚫 Заблокированные <span class="chip" id="bn2"></span></b><button onclick="this.closest('.ov').remove()">✕</button></div><div class="mu">Заблокированные не могут вам писать и звонить.</div><div class="row"><input id="bi" class="g" placeholder="@юзернейм"><select id="br2" style="width:auto"><option>Спам</option><option>Оскорбления</option><option>Мошенничество</option><option>Навязчивость</option><option>Другое</option></select></div><button class="p" id="ba">Заблокировать</button><input id="bf" placeholder="🔍 Поиск по списку"><div id="bk"></div><div class="set">Скрывать их сообщения в чатах<button class="tg ${LS.g("hb")==="1"?"on":""}" id="bh"></button></div><div class="set">Скрывать из поиска<button class="tg ${LS.g("hs")!=="0"?"on":""}" id="bs"></button></div><div class="row"><button class="g" id="bx">📋 Экспорт</button><button class="g" id="bc">Очистить всё</button></div></div>`),Q=s=>o.querySelector(s);
const dr=()=>{const q=Q("#bf").value.toLowerCase(),r=ME.blkr||{},a=(ME.blk||[]).filter(i=>{const u=USERS[i]||{};return !q||(u.name||"").toLowerCase().includes(q)||(u.un||"").includes(q)});Q("#bn2").textContent=(ME.blk||[]).length;Q("#bk").innerHTML=a.length?a.map(i=>{const u=USERS[i]||{name:"?"},x=r[i]||{};return `<div class="set"><span class="row" data-p="${i}" style="cursor:pointer">${avHTML(u)}<span>${esc(u.name)}<br><small>${u.un?"@"+esc(u.un):""} · ${esc(x.r||"—")}${x.t?" · "+new Date(x.t).toLocaleDateString("ru"):""}</small></span></span><button data-u="${i}">Разблок.</button></div>`}).join(""):'<div class="mu">Список пуст</div>'};
Q("#bf").oninput=dr;Q("#ba").onclick=async()=>{const v=Q("#bi").value.trim().replace(/^@/,"").toLowerCase(),u=Object.values(USERS).find(x=>x.un===v);if(!u||u.id===ME.id)return alert("Пользователь не найден");ME.blk=[...new Set([...(ME.blk||[]),u.id])];ME.blkr=Object.assign({},ME.blkr,{[u.id]:{r:Q("#br2").value,t:Date.now()}});await sv();Q("#bi").value="";dr()};
Q("#bk").onclick=async e=>{const i=e.target.dataset.u,p=e.target.closest("[data-p]");if(i){ME.blk=ME.blk.filter(x=>x!==i);delete (ME.blkr||{})[i];await sv();dr()}else if(p)openProfile(p.dataset.p)};
Q("#bc").onclick=async()=>{if(!(ME.blk||[]).length||!confirm("Разблокировать всех?"))return;ME.blk=[];ME.blkr={};await sv();dr()};
Q("#bx").onclick=()=>navigator.clipboard.writeText((ME.blk||[]).map(i=>((USERS[i]||{}).un?"@"+USERS[i].un:i)+" — "+((ME.blkr||{})[i]||{}).r).join("\n")).then(()=>alert("Список скопирован"),()=>0);
[["#bh","hb",0],["#bs","hs",1]].forEach(([s,k,d])=>Q(s).onclick=()=>{const on=!Q(s).classList.contains("on");Q(s).classList.toggle("on",on);LS.s(k,on?"1":"0");renderList();if(CUR)openChat(CUR)});dr()}
applyLook();const th=LS.g("th");if(th&&th!=="auto")document.documentElement.dataset.theme=th;
boot();
</script></body></html>
